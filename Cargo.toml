[package]
name = "yt-music-native"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.5"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
interprocess = "1.2"
sha1 = "0.10"
directories = "5.0"
tray-icon = "0.14"
discord-rich-presence = "0.1"
rfd = "0.14"
regex = "1.10"
walkdir = "2.4"
windows = { version = "0.52", features = [
    "Media", 
    "Media_Playback", 
    "Storage_Streams",
    "Foundation"
]}

[build-dependencies]
slint-build = "1.5"
